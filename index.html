<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Riot Games</title>
</head>

<body>
    <main>
        <div class="credenciais-container">
            <div class="logo">
                <img src="images/riot-logo.png" alt="logo">
            </div>
            <form class="conteiner-forms">
                <span>LOGIN</span>
                <label for="usuario"></label>
                <input type="text" id="usuario" name="usuario" placeholder="Usuário" required>
                <label for="senha"></label>
                <input type="text" id="senha" name="senha" placeholder="Senha" required>
                <div class="link-n-checkbox">
                    <label class="checkbox-simples">
                        <input type="checkbox" required>Lembrar de mim</label>
                    <a href="https://www.google.com/?hl=pt_BR">Esqueceu a senha?</a>
                </div>
            </form>
            <button>Entrar</button>
            <span>Ou entre com:</span>
            <div>
                <span>google</span>
                <span>xbox</span>
            </div>
        </div>
    </main>
</body>

</html>
