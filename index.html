<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Riot Games</title>
</head>

<body>
    <main>
        <div class="credenciais-container">
            <div class="logo">
                <img src="images/riot-logo.png" alt="logo">
            </div>
            <form class="conteiner-conteudo">
                <span class="titulo">LOGIN</span>
                <div>
                    <label for="usuario"></label>
                    <input type="text" id="usuario" name="usuario" placeholder="Usuário" required>
                    <span class="material-symbols-outlined">person</span>
                </div>
                <label for="senha"></label>
                <input type="text" id="senha" name="senha" placeholder="Senha" required>
                <div class="link-n-checkbox">
                    <label class="checkbox-simples">
                        <input type="checkbox" required>Lembrar de mim</label>
                    <a href="https://www.google.com/?hl=pt_BR">Esqueceu a senha?</a>
                </div>
                <input type="submit" value="Entrar">
            </form>
            <div class="link-cadastro">
                <span>Não tem uma conta?</span>
                <a href="https://www.google.com/?hl=pt_BR">Cadastrar</a>
            </div>
            <span>Ou entre com:</span>
            <div class="botoes">
                <button onclick="document.location='default.asp'">
                    <img src="images/logo-google.png" alt="logo xbox" class="icone-botao">
                </button>
                <button class="xbox" onclick="document.location='default.asp'">
                    <img class="logo-xbox" src="images/logo-xbox.png" alt="logo google" class="icone-botao">
                </button>
            </div>
        </div>
    </main>
</body>

</html>
